version: "3.9"

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - deudas-service
      - pagos-service
      - notificaciones-service

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8000"

  deudas-service:
    build: ./deudas-service
    ports:
      - "8002:8000"

  pagos-service:
    build: ./pagos-service
    ports:
      - "8003:8000"

  notificaciones-service:
    build: ./notificaciones-service
    ports:
      - "8004:8000"
